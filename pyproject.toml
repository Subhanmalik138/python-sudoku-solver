[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-solver"
version = "0.1.0"
description = "Fast Sudoku solver with MRV backtracking, solution counting, and a CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
sudoku-solve = "sudoku_solver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
